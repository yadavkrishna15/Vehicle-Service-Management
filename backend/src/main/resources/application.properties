# MongoDB Atlas Connection URI
# Set MONGODB_URI environment variable in your production or local .env
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/vsms}

# Server Port (Default 8080)
server.port=${PORT:8080}

# Enable auto-index creation for unique indexes on MongoDB collections
spring.data.mongodb.auto-index-creation=true

# Allowed CORS Origins (comma-separated if multiple)
app.cors.allowed-origins=${FRONTEND_URL:http://localhost:3000,http://localhost:5500,http://127.0.0.1:5500,http://localhost:8080,https://your-vercel-app.vercel.app}

# Logging configuration
logging.level.com.vsms=INFO
logging.level.org.springframework.data.mongodb=WARN
