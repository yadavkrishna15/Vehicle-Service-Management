<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mechanics - VSMS</title>
    <meta name="description" content="Manage service mechanics, specialization, and availability status.">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="navbar" id="navbar"></header>

    <main class="container">
        <div class="page-header">
            <div>
                <h1 class="page-title">Mechanic Staff 👨‍🔧</h1>
                <p class="page-subtitle">Manage service engineers, specializations, and availability roster.</p>
            </div>
            <button class="btn btn-primary" onclick="openAddModal()">+ Add Mechanic</button>
        </div>

        <div id="alertArea"></div>

        <div class="card" style="padding: 0; overflow: hidden;">
            <div class="table-responsive">
                <table class="table" id="mechanicsTable">
                    <thead>
                        <tr>
                            <th>Staff ID</th>
                            <th>Name</th>
                            <th>Contact</th>
                            <th>Specialization</th>
                            <th>Availability</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr><td colspan="6" style="text-align:center;padding:2rem;">Loading mechanics...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Add/Edit Mechanic Modal -->
    <div class="modal-overlay" id="mechanicModal">
        <div class="modal-box">
            <div class="modal-header">
                <h2 id="mechanicModalTitle">Add New Mechanic</h2>
                <button class="modal-close" onclick="closeModal()">✕</button>
            </div>

            <div id="modalAlertArea"></div>

            <form id="mechanicForm">
                <div class="form-group">
                    <label for="mName" class="form-label">Full Name *</label>
                    <input type="text" id="mName" class="form-control" placeholder="e.g. Ramesh Sharma" required>
                </div>

                <div class="form-group">
                    <label for="mPhone" class="form-label">Phone Number</label>
                    <input type="tel" id="mPhone" class="form-control" placeholder="e.g. 9812345678">
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="mSpecialization" class="form-label">Specialization</label>
                        <select id="mSpecialization" class="form-control">
                            <option value="General Mechanical">General Mechanical</option>
                            <option value="Engine & Transmission">Engine & Transmission</option>
                            <option value="Electrical & Battery">Electrical & Battery</option>
                            <option value="Brakes & Suspension">Brakes & Suspension</option>
                            <option value="AC & Cooling">AC & Cooling</option>
                            <option value="Body & Washing">Body & Washing</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="mAvailability" class="form-label">Availability Status</label>
                        <select id="mAvailability" class="form-control">
                            <option value="Available" selected>Available</option>
                            <option value="Busy">Busy</option>
                        </select>
                    </div>
                </div>

                <div style="display: flex; justify-content: flex-end; gap: 0.75rem; margin-top: 1.5rem;">
                    <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Mechanic</button>
                </div>
            </form>
        </div>
    </div>

    <footer class="footer">
        <p>&copy; 2026 Vehicle Service Management System (VSMS). Built for B.Sc. Computer Science Project.</p>
    </footer>

    <script src="js/api.js"></script>
    <script src="js/mechanics.js"></script>
</body>
</html>
